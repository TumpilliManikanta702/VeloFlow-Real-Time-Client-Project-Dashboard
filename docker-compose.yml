version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: veloflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: veloflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veloflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veloflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/veloflow?schema=public
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173
      SERVER_URL: http://localhost:5000
      JWT_ACCESS_SECRET: prod_access_secret_veloflow_deploy_replace_in_actual_env
      JWT_REFRESH_SECRET: prod_refresh_secret_veloflow_deploy_replace_in_actual_env
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
    ports:
      - "5000:5000"

volumes:
  postgres_data:
